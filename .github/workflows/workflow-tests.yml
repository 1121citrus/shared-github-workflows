name: Workflow tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Test the floating-tag workflow
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            bats/bats:1.13.0 test/tag-floating.bats
